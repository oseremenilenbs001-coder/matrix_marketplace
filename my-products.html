<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b35"><title>My Products | Matrix Marketplace</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f5;color:#17332f;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1000px,calc(100% - 30px));margin:auto}.top{background:linear-gradient(115deg,#102b35,#176b61);color:white;padding:16px 0}.topin{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{color:white;text-decoration:none;font-weight:900}.back{color:#fff;text-decoration:none;border:1px solid #ffffff55;padding:9px 13px;border-radius:10px;font-size:12px;font-weight:800}.intro{padding:27px 0 17px}.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:900;color:#167c69}.intro h1{font-size:30px;margin:4px 0}.intro p{margin:0;color:#71818a}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 16px}.count{color:#71818a;font-size:12px}.add{background:#167c69;color:white;text-decoration:none;padding:11px 16px;border-radius:11px;font-weight:850}.list{display:grid;gap:12px;padding-bottom:40px}.product{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:14px;align-items:start;background:white;border:1px solid #dcebe5;border-radius:16px;padding:14px;box-shadow:0 8px 25px #173b3b08}.photo{width:92px;height:92px;object-fit:cover;border-radius:12px;background:#edf4f0}.placeholder{display:grid;place-items:center;font-size:32px;color:#7b9b8d}.details{min-width:0}.details h2{font-size:16px;margin:0 0 3px;overflow-wrap:anywhere}.price{font-size:16px;font-weight:900;color:#145b50}.old{font-size:12px;color:#8992a5;text-decoration:line-through;margin-left:6px}.meta{font-size:11px;color:#71818a;margin:3px 0 9px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.field label{display:block;font-size:10px;font-weight:800;margin-bottom:4px;color:#63766e}.field input{width:100%;padding:9px;border:1px solid #d8e5df;border-radius:9px;font:inherit}.check{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:750;margin-top:9px}.check input{width:auto}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.btn{border:0;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:850;cursor:pointer}.save{background:#e5f5ef;color:#176354}.delete{background:#fff0f0;color:#b42318}.empty,.notice{background:#fff;border:1px solid #dcebe5;border-radius:15px;padding:28px;text-align:center;color:#71818a}.status{font-size:12px;color:#a33;margin:12px 0}.status.ok{color:#14734e}@media(max-width:600px){.product{grid-template-columns:72px minmax(0,1fr);gap:11px;padding:11px}.photo{width:72px;height:72px}.product>.delete{grid-column:2;justify-self:start}.controls{grid-template-columns:1fr 1fr}.intro h1{font-size:26px}.topin{align-items:flex-start}}
html[data-theme="dark"]{color-scheme:dark}html[data-theme="dark"] body{background:#0d1424;color:#edf2ff}html[data-theme="dark"] .product,html[data-theme="dark"] .empty,html[data-theme="dark"] .notice{background:#182238;border-color:#303d59;color:#edf2ff}html[data-theme="dark"] .intro p,html[data-theme="dark"] .meta,html[data-theme="dark"] .count{color:#aab5cc}html[data-theme="dark"] .field input{background:#101a2d;color:#edf2ff;border-color:#3a4968}
</style></head><body>
<header class="top"><div class="wrap topin"><a class="brand" href="seller.html">MATRIX SELLER STUDIO</a><a class="back" href="seller.html">← My Store</a></div></header>
<main class="wrap"><section class="intro"><span class="eyebrow">MY STORE / INVENTORY</span><h1>My Products</h1><p>View and manage every product published in your store.</p></section>
<div class="toolbar"><span class="count" id="productCount">Loading products…</span><a class="add" href="add-product.html">＋ Add product</a></div>
<div id="notice" class="notice" hidden></div><div id="productList" class="list"><div class="empty">Loading your products…</div></div><div id="message" class="status" role="status"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
let client,user;const $=id=>document.getElementById(id);const money=n=>"₦"+Number(n||0).toLocaleString("en-NG");
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function msg(s,ok=false){$("message").textContent=s;$("message").className=ok?"status ok":"status"}
async function start(){if(!window.supabase||!window.MATRIX_SUPABASE_URL||!window.MATRIX_SUPABASE_ANON_KEY){showNotice("Supabase configuration is missing.");return}client=window.supabase.createClient(window.MATRIX_SUPABASE_URL,window.MATRIX_SUPABASE_ANON_KEY);const {data,error}=await client.auth.getUser();if(error||!data.user){showNotice('Please <a href="auth.html">sign in</a> to view your products.');return}user=data.user;const role=String(user.user_metadata?.role||"buyer").toLowerCase();if(role!=="seller"&&role!=="both"){showNotice("This account does not have seller access.");return}await loadProducts()}
function showNotice(html){$("notice").innerHTML=html;$("notice").hidden=false;$("productList").innerHTML="";$("productCount").textContent="";}
async function loadProducts(){ $("productList").innerHTML='<div class="empty">Loading your products…</div>';const {data,error}=await client.from("products").select("id,title,price,original_price,is_almost_out,category,condition,image_url,stock_quantity,created_at").eq("seller_id",user.id).order("created_at",{ascending:false});if(error){$("productList").innerHTML='<div class="empty">Could not load products: '+safe(error.message)+'</div>';$("productCount").textContent="";return}$("productCount").textContent=(data?.length||0)+" product"+((data?.length||0)===1?"":"s")+" in your store";if(!data?.length){$("productList").innerHTML='<div class="empty">You have not published any products yet.<br><br><a class="add" href="add-product.html">＋ Add your first product</a></div>';return}
$("productList").innerHTML=data.map(p=>'<article class="product">'+(p.image_url?'<img class="photo" src="'+safe(p.image_url)+'" alt="">':'<div class="photo placeholder">📦</div>')+'<div class="details"><h2>'+safe(p.title)+'</h2><div class="price">'+money(p.price)+(p.original_price&&Number(p.original_price)>Number(p.price)?'<span class="old">'+money(p.original_price)+'</span>':'')+'</div><div class="meta">'+safe(p.category)+' · '+safe(p.condition)+(p.is_almost_out?' · 🔥 Hot Deal':'')+'</div><div class="controls"><div class="field"><label>Available stock</label><input type="number" min="0" step="1" value="'+Number(p.stock_quantity??0)+'" data-stock="'+p.id+'"></div><div class="field"><label>Original price (₦)</label><input type="number" min="0" step="1" placeholder="Optional" value="'+(p.original_price||"")+'" data-original="'+p.id+'"></div></div><label class="check"><input type="checkbox" '+(p.is_almost_out?'checked':'')+' data-almost="'+p.id+'"> Mark as almost out of stock</label><div class="actions"><button class="btn save" type="button" data-save="'+p.id+'">Save changes</button><button class="btn delete" type="button" data-delete="'+p.id+'">Delete product</button></div></div></article>').join("");document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>saveProduct(b.dataset.save));document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteProduct(b.dataset.delete))}
async function saveProduct(id){const stock=Number(document.querySelector('[data-stock="'+id+'"]').value),origText=document.querySelector('[data-original="'+id+'"]').value.trim(),original=origText?Number(origText):null,almost=document.querySelector('[data-almost="'+id+'"]').checked;if(!Number.isInteger(stock)||stock<0){msg("Stock must be a whole number of 0 or more.");return}const {data:current,error:readError}=await client.from("products").select("price").eq("id",id).eq("seller_id",user.id).single();if(readError){msg(readError.message);return}if(original!==null&&(!Number.isFinite(original)||original<=Number(current.price))){msg("Original price must be greater than the selling price.");return}const {error}=await client.from("products").update({stock_quantity:stock,original_price:original,is_almost_out:almost}).eq("id",id).eq("seller_id",user.id);if(error){msg("Could not save changes: "+error.message);return}msg("Product updated successfully.",true);await loadProducts()}
async function deleteProduct(id){if(!confirm("Delete this product from your store?"))return;const {error}=await client.from("products").delete().eq("id",id).eq("seller_id",user.id);if(error){msg("Could not delete product: "+error.message);return}msg("Product deleted.",true);await loadProducts()}
start();(()=>{const saved=localStorage.getItem("matrixTheme")||"light";const actual=saved==="system"?(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):saved;document.documentElement.dataset.theme=actual})();
</script></body></html>

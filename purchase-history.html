<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101044"><title>My Orders & Transactions | Matrix Marketplace</title>
<style>
:root{--ink:#211b52;--muted:#73718a;--line:#e9e6f4;--bg:#f7f5ff;--purple:#6655e8;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:85px}.wrap{width:min(920px,calc(100% - 28px));margin:auto}.top{background:#211b52;color:white;padding:17px 0}.top a{color:#fff;text-decoration:none;font-weight:850}.intro{padding:27px 0 16px}.intro h1{font-size:clamp(25px,5vw,34px);margin:0 0 5px}.intro p{color:var(--muted);margin:0}.filters{display:flex;gap:8px;overflow:auto;padding:8px 0 17px}.filters button{border:1px solid var(--line);background:#fff;color:#5c5877;padding:9px 15px;border-radius:22px;font-weight:750;white-space:nowrap}.filters button.active{background:var(--purple);border-color:var(--purple);color:#fff}.order{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin:0 0 13px;box-shadow:0 8px 24px #3528790a}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.ref{font-weight:900;font-size:15px}.date{font-size:12px;color:var(--muted)}.amount{font-size:20px;font-weight:900;white-space:nowrap}.badges{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.badge{font-size:11px;font-weight:800;padding:5px 9px;border-radius:20px;background:#f0edff;color:#5140cb}.badge.paid,.badge.completed,.badge.delivered{background:#e8f7ef;color:#14734e}.badge.pending,.badge.awaiting_payment{background:#fff4df;color:#8a5a08}.badge.cancelled,.badge.failed,.badge.rejected{background:#fff0ef;color:#a3332a}.items{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}.item{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px}.item span:last-child{font-weight:800;white-space:nowrap}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions a,.actions button{display:inline-block;border:1px solid #dcd6ff;border-radius:9px;background:#f3f0ff;color:#5140cb;padding:9px 12px;text-decoration:none;font:inherit;font-size:12px;font-weight:800}.actions .primary{background:var(--purple);color:#fff;border-color:var(--purple)}.empty,.state{background:#fff;border:1px dashed #d8d2ed;border-radius:15px;padding:30px 18px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}.error{color:#a3332a}.hidden{display:none!important}.section-label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin:18px 0 9px}
.receipt-backdrop{position:fixed;inset:0;background:#171331b8;display:none;align-items:center;justify-content:center;padding:14px;z-index:100}.receipt-backdrop.open{display:flex}.receipt-panel{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;color:#211b52}.receipt-brand{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #6655e8;padding-bottom:14px}.receipt-brand strong{font-size:20px}.receipt-tag{font-size:10px;letter-spacing:1.2px;font-weight:900;color:#6655e8}.receipt-title{text-align:center;padding:20px 0 12px}.receipt-title h2{margin:0;font-size:25px}.receipt-title p{margin:4px 0;color:#73718a;font-size:12px}.receipt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f7f5ff;border-radius:12px;padding:13px;margin:12px 0}.receipt-grid small,.receipt-meta small{display:block;color:#73718a;font-size:10px;text-transform:uppercase;letter-spacing:.6px}.receipt-grid b,.receipt-meta b{overflow-wrap:anywhere;font-size:13px}.receipt-table{width:100%;border-collapse:collapse;margin:15px 0}.receipt-table th,.receipt-table td{padding:10px 5px;border-bottom:1px solid #e9e6f4;text-align:left;font-size:12px}.receipt-table th:last-child,.receipt-table td:last-child{text-align:right}.receipt-totals{width:min(300px,100%);margin-left:auto}.receipt-totals div{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}.receipt-totals .grand{border-top:2px solid #211b52;margin-top:6px;padding-top:10px;font-size:18px;font-weight:900}.receipt-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:13px 0;border-top:1px dashed #d8d2ed;margin-top:15px}.receipt-note{background:#f7f5ff;border-radius:10px;padding:11px;font-size:11px;color:#625b7e;margin-top:14px}.receipt-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}.receipt-actions button{border:0;border-radius:9px;padding:10px 15px;background:#6655e8;color:#fff;font-weight:800}.receipt-actions .secondary{background:#eeeafd;color:#5140cb}.actions .receipt-btn{background:#211b52;color:#fff;border-color:#211b52}@media print{body *{visibility:hidden!important}.receipt-backdrop,.receipt-backdrop *{visibility:visible!important}.receipt-backdrop{display:block!important;position:absolute;inset:0;background:#fff;padding:0}.receipt-panel{max-height:none;overflow:visible;width:100%;border-radius:0;padding:10px;box-shadow:none}.receipt-actions{display:none!important}}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:12px 8px calc(12px + env(safe-area-inset-bottom));z-index:5}.bottom a{color:#625b7e;text-decoration:none;font-size:12px;font-weight:800}.bottom a.active{color:var(--purple)}
@media(max-width:520px){.order{padding:14px}.order-head{align-items:flex-start}.amount{font-size:18px}.bottom a{font-size:11px}}

/* Shared Matrix Marketplace electric blue / cyan / violet identity */
:root{--matrix-ink:#17152d;--matrix-muted:#74758e;--matrix-blue:#087bff;--matrix-violet:#7621ed;--matrix-cyan:#00dfff;--matrix-line:#e5e3f3;--matrix-bg:#f7f6ff;--matrix-shadow:0 16px 42px rgba(38,25,105,.12)}
html,body{background:var(--matrix-bg);color:var(--matrix-ink)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header,.top,header.top,.intro{background:linear-gradient(110deg,#050713 0%,#111044 62%,#25105d 100%);color:#fff;border-color:#30236f;box-shadow:0 8px 24px rgba(12,10,54,.12)}
header a,.top a,header .brand,.top .brand,.intro h1{color:#fff}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.3px;text-decoration:none}
.brand::before{content:"M";display:inline-grid;place-items:center;width:35px;height:35px;border-radius:11px;color:#fff;font-size:20px;font-weight:950;background:linear-gradient(135deg,#00dfff 0%,#087bff 48%,#8a20ef 100%);box-shadow:0 0 18px #247cff55}
.back,header .back{color:#d9e5ff;background:#ffffff12;border:1px solid #ffffff30;border-radius:10px;padding:8px 12px;text-decoration:none}
a{color:#5429d4}
button,.btn,input,select,textarea{font:inherit}
button[type=submit],.btn-primary,.primary,.primary-btn,.submit-btn{background:linear-gradient(110deg,#087bff,#7621ed);color:#fff;border:0;box-shadow:0 7px 18px #4a38d52b}
button[type=submit]:hover,.btn-primary:hover,.primary:hover,.primary-btn:hover,.submit-btn:hover{filter:brightness(1.08)}
input:not([type=checkbox]):not([type=radio]),select,textarea{border-color:#dedcf0}
input:focus,select:focus,textarea:focus{outline:none;border-color:#278bff;box-shadow:0 0 0 4px #278bff1c}
.card,.panel,.box,.section,.form-card,.auth-card,.content-card,.stat-card,.order-card,.product-card,.settings-card,.modal,.container-card{border-color:var(--matrix-line);box-shadow:var(--matrix-shadow)}
h1,h2,h3{letter-spacing:-.3px}
.badge,.pill,.tag{border-radius:999px}
hr{border-color:var(--matrix-line)}
::selection{background:#b9eaff;color:#15123d}
@media(max-width:600px){.brand::before{width:31px;height:31px;font-size:18px}}
html[data-theme="dark"],html[data-theme="dark"] body{background:#080b18;color:#edf2ff}
html[data-theme="dark"] header,html[data-theme="dark"] .top,html[data-theme="dark"] header.top{background:linear-gradient(110deg,#03040b,#101044 62%,#25105d);color:#fff}
html[data-theme="dark"] .brand,html[data-theme="dark"] header a,html[data-theme="dark"] .top a{color:#f4f2ff}
html[data-theme="dark"] input:not([type=checkbox]):not([type=radio]),html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:#10182c;color:#edf2ff;border-color:#354064}
html[data-theme="dark"] .card,html[data-theme="dark"] .panel,html[data-theme="dark"] .box,html[data-theme="dark"] .section,html[data-theme="dark"] .form-card,html[data-theme="dark"] .auth-card,html[data-theme="dark"] .content-card,html[data-theme="dark"] .stat-card,html[data-theme="dark"] .order-card,html[data-theme="dark"] .product-card,html[data-theme="dark"] .settings-card,html[data-theme="dark"] .modal,html[data-theme="dark"] .container-card{background:#111a30;color:#edf2ff;border-color:#303d59}

</style></head><body>
<div class="top"><div class="wrap"><a href="index.html">← MATRIX MARKETPLACE</a></div></div>
<main class="wrap"><header class="intro"><h1>My Orders & Transactions</h1><p>Track your purchases, payment references and order progress in one place.</p></header>
<div class="filters" aria-label="Filter purchases"><button class="active" data-filter="all">All</button><button data-filter="active">In progress</button><button data-filter="paid">Paid</button><button data-filter="pending">Awaiting payment</button><button data-filter="completed">Completed</button></div>
<div id="message" class="state">Loading your purchase history…</div><div id="orders"></div>
</main>
<div class="receipt-backdrop" id="receiptBackdrop" role="dialog" aria-modal="true" aria-label="Purchase receipt"><section class="receipt-panel" id="receiptPanel"></section></div>
<nav class="bottom"><a href="index.html">Home</a><a href="categories.html">Categories</a><a href="community.html">Profile</a><a class="active" href="purchase-history.html">My Orders</a></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const $=id=>document.getElementById(id),money=n=>"₦"+Number(n||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
const client=window.supabase&&window.MATRIX_SUPABASE_URL&&window.MATRIX_SUPABASE_ANON_KEY?window.supabase.createClient(window.MATRIX_SUPABASE_URL,window.MATRIX_SUPABASE_ANON_KEY):null;
let records=[],filter="all",buyer=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nice=v=>String(v||"unknown").replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
function date(v){return v?new Date(v).toLocaleString("en-NG",{dateStyle:"medium",timeStyle:"short"}):"Date unavailable"}
function render(){
 const list=records.filter(o=>filter==="all"||(filter==="active"&&!["completed","cancelled"].includes(o.status))||(filter==="paid"&&o.payment_status==="paid")||(filter==="pending"&&o.payment_status==="pending")||(filter==="completed"&&o.status==="completed"));
 if(!list.length){$("orders").innerHTML='<div class="empty"><b>No purchases found</b>'+(records.length?"There are no orders in this filter.":"Your purchases will appear here after you place an order.")+'</div>';return}
 $("orders").innerHTML=list.map(o=>{
 const items=o.items||[],sub=o.submission,pay=o.payment;
 const paymentLine=pay?.provider_reference||sub?.transfer_reference||"No transaction reference submitted";
 const transactionStatus=pay?.status==="successful"?"Successful":sub?nice(sub.status):"Awaiting payment";
 return '<article class="order"><div class="order-head"><div><div class="ref">'+esc(o.order_number||o.id)+'</div><div class="date">Placed '+esc(date(o.created_at))+'</div></div><div class="amount">'+money(o.total_amount)+'</div></div><div class="badges"><span class="badge '+esc(o.status)+'">'+esc(nice(o.status))+'</span><span class="badge '+esc(o.payment_status)+'">Payment: '+esc(nice(o.payment_status))+'</span></div><div class="section-label">Items purchased</div><div class="items">'+(items.length?items.map(i=>'<div class="item"><span>'+esc(i.product_title)+' × '+esc(i.quantity)+'</span><span>'+money(i.line_total)+'</span></div>').join(""):'<div class="item">Item details unavailable</div>')+'</div><div class="section-label">Transaction record</div><div class="item"><span>Payment review</span><strong>'+esc(transactionStatus)+'</strong></div><div class="item"><span>Reference</span><strong style="overflow-wrap:anywhere;text-align:right">'+esc(paymentLine)+'</strong></div>'+(sub?.admin_note?'<div class="item"><span>Review note</span><span>'+esc(sub.admin_note)+'</span></div>':"")+'<div class="actions">'+(o.payment_status==="pending"&&o.status==="awaiting_payment"?'<a class="primary" href="payment.html?order='+encodeURIComponent(o.id)+'">Continue payment</a>':"")+'<button type="button" class="receipt-btn" data-receipt="'+esc(o.id)+'">View receipt</button><button type="button" data-toggle="'+esc(o.id)+'">Hide items</button></div></article>';
 }).join("");
 document.querySelectorAll("[data-receipt]").forEach(b=>b.onclick=()=>showReceipt(b.dataset.receipt));
 document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{const box=b.closest(".order").querySelector(".items");box.classList.toggle("hidden");b.textContent=box.classList.contains("hidden")?"Show items":"Hide items"});
}
function showReceipt(id){
 const o=records.find(x=>x.id===id);if(!o)return;
 const sub=o.submission,pay=o.payment,paid=o.payment_status==="paid";
 const buyerName=buyer?.user_metadata?.full_name||buyer?.user_metadata?.name||buyer?.email||"Buyer";
 const ref=pay?.provider_reference||sub?.transfer_reference||"Not available";
 const rows=(o.items||[]).map(i=>'<tr><td>'+esc(i.product_title)+'</td><td>'+esc(i.quantity)+'</td><td>'+money(i.unit_price??(Number(i.line_total)/Math.max(1,Number(i.quantity))))+'</td><td>'+money(i.line_total)+'</td></tr>').join("");
 $("receiptPanel").innerHTML='<div class="receipt-brand"><strong>◈ MATRIX MARKETPLACE</strong><span class="receipt-tag">PURCHASE RECEIPT</span></div><div class="receipt-title"><h2>'+(paid?'Payment Receipt':'Order Receipt')+'</h2><p>'+(paid?'Payment recorded for this order':'Order record — payment is not yet confirmed')+'</p></div><div class="receipt-grid"><div><small>Order number</small><b>'+esc(o.order_number||o.id)+'</b></div><div><small>Order date</small><b>'+esc(date(o.created_at))+'</b></div><div><small>Customer</small><b>'+esc(buyerName)+'</b></div><div><small>Email</small><b>'+esc(buyer?.email||"Not available")+'</b></div></div><div class="section-label">Purchase details</div><table class="receipt-table"><thead><tr><th>Item</th><th>Qty</th><th>Unit price</th><th>Total</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4">Item details unavailable</td></tr>')+'</tbody></table><div class="receipt-totals"><div><span>Subtotal</span><b>'+money(o.subtotal??o.total_amount)+'</b></div><div><span>Delivery fee</span><b>'+money(o.delivery_fee||0)+'</b></div><div class="grand"><span>Total</span><span>'+money(o.total_amount)+'</span></div></div><div class="receipt-meta"><div><small>Order status</small><b>'+esc(nice(o.status))+'</b></div><div><small>Payment status</small><b>'+esc(nice(o.payment_status))+'</b></div><div><small>Payment reference</small><b>'+esc(ref)+'</b></div><div><small>Payment review</small><b>'+esc(pay?.status==="successful"?"Successful":sub?nice(sub.status):"Not submitted")+'</b></div><div><small>Fulfilment</small><b>'+esc(nice(o.fulfillment_method||"Not recorded"))+'</b></div><div><small>Receipt generated</small><b>'+esc(date(new Date().toISOString()))+'</b></div></div><div class="receipt-note">'+(paid?'This receipt records the order and its current payment status. Keep it for your records.':'This is an order receipt, not proof of payment. It becomes a payment receipt only after payment is verified as paid.')+'</div><div class="receipt-actions"><button class="secondary" type="button" id="closeReceipt">Close</button><button type="button" id="printReceipt">Print / Save as PDF</button></div>';
 $("receiptBackdrop").classList.add("open");$("closeReceipt").onclick=()=>$("receiptBackdrop").classList.remove("open");$("printReceipt").onclick=()=>window.print();
}
async function init(){
 if(!client){$("message").textContent="We could not connect right now. Please reload this page.";return}
 try{
 const {data:{user},error:authError}=await client.auth.getUser();
 if(authError||!user){$("message").innerHTML='Please sign in to view your purchases. <a href="auth.html">Log in</a>';return}
 buyer=user;
 const {data:orders,error}=await client.from("matrix_orders").select("id,order_number,subtotal,delivery_fee,total_amount,status,payment_status,fulfillment_method,created_at").eq("buyer_id",user.id).order("created_at",{ascending:false});
 if(error)throw error;
 records=orders||[];
 if(records.length){
 const ids=records.map(o=>o.id);
 const [items,payments,submissions]=await Promise.all([
 client.from("matrix_order_items").select("order_id,product_title,quantity,line_total").in("order_id",ids),
 client.from("matrix_payments").select("order_id,status,provider_reference,amount").in("order_id",ids),
 client.from("matrix_manual_payment_submissions").select("order_id,transfer_reference,status,admin_note,created_at").in("order_id",ids)
 ]);
 if(items.error)throw items.error;
 records.forEach(o=>{o.items=(items.data||[]).filter(i=>i.order_id===o.id);o.payment=(payments.data||[]).find(p=>p.order_id===o.id)||null;o.submission=(submissions.data||[]).find(s=>s.order_id===o.id)||null});
 }
 $("message").classList.add("hidden");render();
 }catch(e){$("message").classList.add("error");$("message").textContent=e.message||"We could not load your purchase history. Please try again."}
}
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()}));
init();
</script></body></html>

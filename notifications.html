<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101044"><title>Notifications | Matrix Marketplace</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17372f;background:#f3f8f5}*{box-sizing:border-box}body{margin:0}.top{background:#fff;border-bottom:1px solid #dceae3;padding:14px 18px}.topin{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;color:#075b4b;text-decoration:none}.back{background:#eaf5ef;color:#086d58;padding:10px 14px;border-radius:11px;text-decoration:none;font-weight:800}.wrap{max-width:900px;margin:28px auto;padding:0 16px}.hero{border-radius:22px;background:linear-gradient(130deg,#075b4b,#159477);color:white;padding:25px;margin-bottom:18px;box-shadow:0 12px 28px #075b4b20}.hero small{font-weight:850;letter-spacing:1.4px;opacity:.8}.hero h1{margin:7px 0;font-size:clamp(27px,5vw,35px)}.hero p{margin:0;opacity:.9}.panel{background:#fff;border:1px solid #dceae3;border-radius:18px;padding:18px;box-shadow:0 8px 25px #174b3b0a}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#eaf5ef;color:#086d58;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.item{padding:17px 2px;border-bottom:1px solid #e6eee9}.item:last-child{border-bottom:0}.item.unread{border-left:4px solid #159477;padding-left:13px;background:#f7fbf8}.item h3{font-size:16px;margin:0 0 7px}.item p{margin:0 0 9px;color:#53685e;line-height:1.5}.item small{color:#7b8c83}.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;padding:35px 12px;color:#71847b}.hidden{display:none!important}@media(max-width:520px){.wrap{margin:18px auto}.hero{padding:21px}.panel{padding:14px}}

/* Shared Matrix Marketplace electric blue / cyan / violet identity */
:root{--matrix-ink:#17152d;--matrix-muted:#74758e;--matrix-blue:#087bff;--matrix-violet:#7621ed;--matrix-cyan:#00dfff;--matrix-line:#e5e3f3;--matrix-bg:#f7f6ff;--matrix-shadow:0 16px 42px rgba(38,25,105,.12)}
html,body{background:var(--matrix-bg);color:var(--matrix-ink)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header,.top,header.top,.intro{background:linear-gradient(110deg,#050713 0%,#111044 62%,#25105d 100%);color:#fff;border-color:#30236f;box-shadow:0 8px 24px rgba(12,10,54,.12)}
header a,.top a,header .brand,.top .brand,.intro h1{color:#fff}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.3px;text-decoration:none}
.brand::before{content:"M";display:inline-grid;place-items:center;width:35px;height:35px;border-radius:11px;color:#fff;font-size:20px;font-weight:950;background:linear-gradient(135deg,#00dfff 0%,#087bff 48%,#8a20ef 100%);box-shadow:0 0 18px #247cff55}
.back,header .back{color:#d9e5ff;background:#ffffff12;border:1px solid #ffffff30;border-radius:10px;padding:8px 12px;text-decoration:none}
a{color:#5429d4}
button,.btn,input,select,textarea{font:inherit}
button[type=submit],.btn-primary,.primary,.primary-btn,.submit-btn{background:linear-gradient(110deg,#087bff,#7621ed);color:#fff;border:0;box-shadow:0 7px 18px #4a38d52b}
button[type=submit]:hover,.btn-primary:hover,.primary:hover,.primary-btn:hover,.submit-btn:hover{filter:brightness(1.08)}
input:not([type=checkbox]):not([type=radio]),select,textarea{border-color:#dedcf0}
input:focus,select:focus,textarea:focus{outline:none;border-color:#278bff;box-shadow:0 0 0 4px #278bff1c}
.card,.panel,.box,.section,.form-card,.auth-card,.content-card,.stat-card,.order-card,.product-card,.settings-card,.modal,.container-card{border-color:var(--matrix-line);box-shadow:var(--matrix-shadow)}
h1,h2,h3{letter-spacing:-.3px}
.badge,.pill,.tag{border-radius:999px}
hr{border-color:var(--matrix-line)}
::selection{background:#b9eaff;color:#15123d}
@media(max-width:600px){.brand::before{width:31px;height:31px;font-size:18px}}
html[data-theme="dark"],html[data-theme="dark"] body{background:#080b18;color:#edf2ff}
html[data-theme="dark"] header,html[data-theme="dark"] .top,html[data-theme="dark"] header.top{background:linear-gradient(110deg,#03040b,#101044 62%,#25105d);color:#fff}
html[data-theme="dark"] .brand,html[data-theme="dark"] header a,html[data-theme="dark"] .top a{color:#f4f2ff}
html[data-theme="dark"] input:not([type=checkbox]):not([type=radio]),html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:#10182c;color:#edf2ff;border-color:#354064}
html[data-theme="dark"] .card,html[data-theme="dark"] .panel,html[data-theme="dark"] .box,html[data-theme="dark"] .section,html[data-theme="dark"] .form-card,html[data-theme="dark"] .auth-card,html[data-theme="dark"] .content-card,html[data-theme="dark"] .stat-card,html[data-theme="dark"] .order-card,html[data-theme="dark"] .product-card,html[data-theme="dark"] .settings-card,html[data-theme="dark"] .modal,html[data-theme="dark"] .container-card{background:#111a30;color:#edf2ff;border-color:#303d59}

</style></head><body><header class="top"><div class="topin"><a class="brand" href="seller.html">MATRIX MARKETPLACE</a><a class="back" href="seller.html">← My Store</a></div></header><main class="wrap"><section class="hero"><small>STORE ALERTS</small><h1>Notifications 🔔</h1><p>Stay updated about orders placed for your products.</p></section><section class="panel"><div class="actions"><strong id="notificationCount">Loading notifications…</strong><div><button class="btn" id="markAll" type="button">Mark all read</button> <button class="btn" id="refresh" type="button">↻ Refresh</button></div></div><div id="notificationList"><div class="empty">Loading…</div></div></section><div id="notice" class="panel hidden" style="margin-top:15px"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
let client=null,currentUser=null;const $=id=>document.getElementById(id);
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function loadNotifications(){
 const box=$("notificationList");box.innerHTML='<div class="empty">Loading notifications…</div>';
 const {data,error}=await client.from("matrix_seller_notifications").select("id,order_id,related_id,notification_type,title,message,created_at,read_at").eq("seller_id",currentUser.id).order("created_at",{ascending:false}).limit(50);
 if(error){box.innerHTML='<div class="empty">Notifications could not be loaded. Please try again later.</div>';$("notificationCount").textContent="";return}
 const rows=data||[],unread=rows.filter(n=>!n.read_at).length;
 $("notificationCount").textContent=unread?unread+" unread notification"+(unread===1?"":"s"):"You're all caught up";
 $("markAll").disabled=unread===0;
 if(!rows.length){box.innerHTML='<div class="empty">No notifications yet. New customer orders will appear here.</div>';return}
 box.innerHTML=rows.map(n=>'<article class="item '+(!n.read_at?'unread':'')+'"><h3>'+safe(n.title)+'</h3><p>'+safe(n.message)+'</p><small>'+new Date(n.created_at).toLocaleString()+' · '+(n.read_at?'Read':'Unread')+'</small><div class="item-actions">'+(!n.read_at?'<button class="btn" type="button" data-read="'+n.id+'">Mark as read</button>':'')+'<button class="btn" type="button" data-order="'+safe(n.order_id)+'">View order</button></div></article>').join("");
 document.querySelectorAll("[data-read]").forEach(b=>b.onclick=async()=>{b.disabled=true;const {error}=await client.from("matrix_seller_notifications").update({read_at:new Date().toISOString()}).eq("id",b.dataset.read).eq("seller_id",currentUser.id);if(error){b.disabled=false;alert("Could not mark as read: "+error.message);return}await loadNotifications()});
 document.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>location.href="seller.html#sellerOrders");
}
async function start(){
 if(!window.supabase||!window.MATRIX_SUPABASE_URL||!window.MATRIX_SUPABASE_ANON_KEY){$("notice").textContent="Notifications are temporarily unavailable. Please try again later.";$("notice").classList.remove("hidden");return}
 client=window.supabase.createClient(window.MATRIX_SUPABASE_URL,window.MATRIX_SUPABASE_ANON_KEY);
 const {data,error}=await client.auth.getUser();
 if(error||!data.user){$("notice").innerHTML='<h2>Sign in required</h2><p>Sign in to your seller account to view store notifications.</p><a class="back" href="auth.html">Sign in</a>';$("notice").classList.remove("hidden");$("notificationList").classList.add("hidden");return}
 currentUser=data.user;const role=String(currentUser.user_metadata?.role||"buyer").toLowerCase();
 if(role!=="seller"&&role!=="both"){$("notice").innerHTML='<h2>Seller registration required</h2><p>This page is only available to registered sellers.</p><a class="back" href="index.html">Back to marketplace</a>';$("notice").classList.remove("hidden");$("notificationList").classList.add("hidden");return}
 await loadNotifications();setInterval(loadNotifications,30000);
}
$("refresh").onclick=loadNotifications;
$("markAll").onclick=async()=>{const {error}=await client.from("matrix_seller_notifications").update({read_at:new Date().toISOString()}).eq("seller_id",currentUser.id).is("read_at",null);if(error){alert("Could not update notifications: "+error.message);return}await loadNotifications()};
start();
</script></body></html>
